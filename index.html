    .shiny-gold-btn {

    /* Dropdown Styles for Top Toolbar & Shop */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-menu {
      display: none;
      position: absolute;
      background-color: #FAF6ED;
      min-width: 260px;

      border: 1px solid rgba(160, 128, 72, 0.3);
      z-index: 100;
      border-radius: 12px;
      right: 0;
    }
    .dropdown:hover > .dropdown-menu { display: block; }
    
    .dropdown-item { position: relative; }
    .submenu {
      display: none;
      position: absolute;
      right: 100%;
      top: 0;
      background-color: #FAF6ED;
      min-width: 280px;
      box-shadow: 0px 15px 35px rgba(68, 40, 36, 0.15);
      border: 1px solid rgba(160, 128, 72, 0.3);
      border-radius: 12px;
      max-height: 320px;
      overflow-y: auto;
    }
    .dropdown-item:hover > .submenu { display: block; }
    
    .submenu a, .dropdown-item > a, .dropdown-menu div {
      color: #442824;
      padding: 10px 16px;
      text-decoration: none;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      border-bottom: 1px solid rgba(160, 128, 72, 0.1);
    }
    .submenu a:hover, .dropdown-item > a:hover { background-color: rgba(160, 128, 72, 0.15); color: #5B1408; }
  </style>
